# GPU appraisal outreach: configuration.
# This repo is public. Put your name, company and pitch in config.local.yaml.

sender:
  sender_name: ""
  company_name: ""
  sender_email: ""
  one_liner: ""
  # Say only what is true. Do not write "YC-backed" for an interview.
  reason_now: "I have a YC interview on Monday and I want to test the idea against people who do this work."
  call_ask: "Could I get 15 minutes this weekend? A two-line reply also helps."
  signoff: ""

pipeline:
  followup_after_days: 1      # The window is three days, so follow up fast.

# Length limits per channel. LinkedIn notes: 200 characters on a free account,
# 300 on Premium. Set linkedin_note to 300 in config.local.yaml if you have Premium.
limits:
  linkedin_note: 200
  x_dm: 500

qualify:
  # A prospect is "confirmed" when one sentence has a term from each list.
  asset_terms:
    - gpu
    - neocloud
    - compute
    - ai infrastructure
    - ai data center
    - accelerator
    - coreweave
    - lambda
    - crusoe
  role_terms:
    - loan
    - lending
    - lender
    - credit
    - debt
    - financing
    - collateral
    - underwriting
    - appraisal
    - valuation
    - depreciation
    - residual
    - useful life
    - resale
    - secured
    - asset-based
  # Do not cold-pitch these. A journalist can quote you, and a competitor
  # learns your plan. Change this list when you want to.
  do_not_contact:
    - competitor
    - journalist

scoring:
  segment_weight: 40
  segments:
    bank: 40
    private_credit: 40
    abf_specialty: 40
    equipment_finance: 36
    insurer: 34
    appraiser: 34
    rating_agency: 30
    neocloud: 28
    gpu_resale: 28
    market_data: 24
    lawyer: 24
    reliability_expert: 22
    analyst: 20
    founder: 18
  categories:
    asset:
      weight: 20
      keywords:
        gpu: 14
        neocloud: 12
        compute: 6
        ai infrastructure: 10
        digital infrastructure: 8
        data center: 6
    role:
      weight: 25
      keywords:
        collateral: 12
        underwriting: 12
        appraisal: 12
        valuation: 10
        residual: 12
        depreciation: 10
        useful life: 10
        asset-based: 10
        asset backed: 10
        equipment finance: 10
        structured: 6
        credit: 6
        delayed draw: 8
        ddtl: 8
  bonuses:
    cmu_link: 10
    on_x: 3
    public_email: 4
    role_confirmed: 3

# Messages. Do not claim customers, pilots or data that you do not have.
templates:
  groups:
    lender: [bank, private_credit, abf_specialty, equipment_finance]
    valuation: [appraiser, insurer, rating_agency, market_data]
    borrower: [neocloud]
    market: [gpu_resale, reliability_expert]
    voice: [analyst, lawyer, founder]
  asks:
    lender: "How do you decide what a GPU is worth over the life of a loan, and what would you want to know that you can't see today?"
    valuation: "Where do GPU values go wrong today, and would usage or thermal data change your numbers?"
    borrower: "What do lenders ask you to prove about your fleet, and what would you never share with them?"
    market: "How much does a GPU's usage history change what it sells for or how long it lasts?"
    voice: "Who feels this problem the most, and who should I talk to?"
    default: "What am I getting wrong about this problem?"
  channels:
    linkedin_note:
      body: "Hi {first_name}, {opener} I'm researching how lenders value GPU collateral over a loan's life. Could I ask you a few questions?"
    linkedin_dm:
      body: |
        Hi {first_name}, {opener}

        {one_liner} We are early, and I am here to learn, not to sell. {reason_now}

        One question: {ask}

        {call_ask}

        {signoff}
    x_dm:
      body: "Hi {first_name}, {opener} {one_liner} I am here to learn, not to sell. {ask} {call_ask}"
    email:
      subject: "Question on GPU collateral at {firm}"
      body: |
        Hi {first_name},

        {opener}

        {one_liner} We are early, and I am here to learn, not to sell. {reason_now}

        One question: {ask}

        {call_ask}

        {signoff}
        {company_name}

        If this is not for you, say so and I will not write again.
    followup:
      body: "Hi {first_name}, one short follow-up. If a call is too much, one line helps: {ask} If this is not your area, who should I ask? Thanks, {signoff}"

# Shown on each prospect page. Ask about the past, not about your idea.
discovery_questions:
  - "Walk me through your last GPU-backed deal. Who valued the collateral, and how?"
  - "What did you assume for depreciation and useful life? Where did that number come from?"
  - "After closing, what do you see about the collateral? How often?"
  - "When did a value surprise you? What did you do?"
  - "What happens to the loan if the value falls? Who gets the call?"
  - "If a borrower must share GPU telemetry, who says no? Why?"
  - "Who pays for an appraisal today, how much, and who signs off on it?"
  - "Would a regulator, auditor or rating agency accept a value based on telemetry?"
  - "Who else should I talk to? Can you introduce me?"
