<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GPU Outreach{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}" class="brand">GPU Outreach</a>
    <nav>
      <a href="{{ url_for('index') }}">Prospects</a>
      <a href="{{ url_for('alumni') }}">CMU alumni</a>
      <a href="{{ url_for('export_pipeline') }}">Export CSV</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Nothing is sent from here. You send every message yourself.</footer>
</body>
</html>
